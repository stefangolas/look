[package]
name = "truck-topology"
version = "0.6.0"
authors = ["Yoshinori Tanimura <tanimura@ricos.co.jp>"]
edition = "2021"
description = "topological structs: vertex, edge, wire, face, shell, and solid"
homepage = "https://github.com/ricosjp/truck"
repository = "https://github.com/ricosjp/truck"
license = "Apache-2.0"

keywords = ["truck", "graphics"]
categories = ["graphics"]

[dependencies]
inari = { version = "2.0", default-features = false }
parking_lot = "0.12.5"
rayon = "1.12.0"
rclite = { version = "0.4.1", optional = true }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
truck-base = { version = "0.5.0", path = "../truck-base" }
truck-evidence = { version = "0.1.0", path = "../truck-evidence" }
truck-geometry = { version = "0.5.0", path = "../truck-geometry" }
truck-geotrait = { version = "0.4.0", path = "../truck-geotrait" }

[features]
default = ["rclite"]
nightly = ["parking_lot/nightly"]

[dev-dependencies]
serde_json = "1.0"
