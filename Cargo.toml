[package]
name = "look"
version = "0.1.0"
edition = "2024"
description = "An ultrafast, agent-oriented renderer for GLB, STL, and STEP scenes"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
pollster = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
wgpu = "30.0"

# STEP support. These track forks of truck and ruststep pinned to exact
# revisions: upstream publishes to crates.io roughly every two years, and the
# released versions cannot read AP242 at all. The forks carry the fixes and
# give us somewhere to land our own. Bump the revs deliberately, never track a
# branch, so a build is always reproducible. truck-assembly is the graph
# resolver `Table::step_assy` builds; it must be pinned with the rest.
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-meshalgo = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-polymesh = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-stepio = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-topology = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }

[patch.crates-io]
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-base = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-derivers = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-geometry = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-geotrait = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-meshalgo = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-modeling = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-polymesh = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-stepio = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }
truck-topology = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }


[dev-dependencies]
tempfile = "3.20"
truck-geometry = { git = "https://github.com/stefangolas/truck", rev = "b926c48749d3597e57d8db85d0923647bcf786d8" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# PLANAR-C: Spade's splitting API can panic on dense crossing networks that it
# cannot planarize; those must be contained as per-face typed failures rather
# than aborting the whole model census. `catch_unwind` is a no-op under
# `panic = "abort"`, so unwind (the default) is required for the containment to
# work. A contained face failure is strictly safer than a process abort.
panic = "unwind"

# Quick: the development loop profile. Optimized for edit-rebuild-run wall
# time, not authoritative runtime. `target/quick/look.exe` is a
# development/debugging/focused-validation artifact and must never be used for
# recorded performance numbers — those come from `target/release/look.exe`.
#
# Semantics: `inherits = "dev"` keeps debug assertions and the unwind
# behavior PLANAR-C relies on. `opt-level = 2` keeps per-model runtime within
# ~2.5x of release so focused validation stays usable. `lto = "off"` and
# `codegen-units = 256` trade final-binary speed for high codegen parallelism;
# `incremental = true` caches per-file codegen between edits.
[profile.quick]
inherits = "dev"
opt-level = 2
debug = false
lto = "off"
incremental = true
codegen-units = 256
