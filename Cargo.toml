# The vendored kernel crates are workspace members, not merely path
# dependencies. A path dependency that is not a member cannot be tested --
# `cargo test -p truck-evidence` fails with "requires dev-dependencies and is
# not a member of the workspace" -- and per-crate testing is exactly what the
# BG- build loop's verification gate runs (docs/KERNEL_AUTOBUILD_LOOP.md, V5).
[workspace]
members = [
    ".",
    "showcases",
    "vendor/truck/truck-assembly",
    "vendor/truck/truck-base",
    "vendor/truck/truck-certified",
    "vendor/truck/truck-derivers",
    "vendor/truck/truck-evidence",
    "vendor/truck/truck-geometry",
    "vendor/truck/truck-geotrait",
    "vendor/truck/truck-meshalgo",
    "vendor/truck/truck-modeling",
    "vendor/truck/truck-polymesh",
    "vendor/truck/truck-shapeops",
    "vendor/truck/truck-stepio",
    "vendor/truck/truck-topology",
]

[package]
name = "look"
version = "0.1.0"
edition = "2024"
description = "An ultrafast, agent-oriented renderer for GLB, STL, and STEP scenes"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
pollster = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
wgpu = "30.0"

# STEP support. truck is vendored in-tree at vendor/truck (pinned rev
# c5f4b6e9778e0721a1d446f10568eb5e5594e8ed) so agents can edit it and the
# build is reproducible from a clean clone. ruststep remains a pinned git
# fork: upstream publishes to crates.io roughly every two years, and the
# released versions cannot read AP242 at all. Bump the ruststep rev
# deliberately, never track a branch. truck-assembly is the graph resolver
# `Table::step_assy` builds; it must move with the rest.
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { path = "vendor/truck/truck-assembly" }
truck-meshalgo = { path = "vendor/truck/truck-meshalgo" }
truck-polymesh = { path = "vendor/truck/truck-polymesh" }
truck-stepio = { path = "vendor/truck/truck-stepio" }
truck-topology = { path = "vendor/truck/truck-topology" }

[patch.crates-io]
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-assembly = { path = "vendor/truck/truck-assembly" }
truck-base = { path = "vendor/truck/truck-base" }
truck-derivers = { path = "vendor/truck/truck-derivers" }
truck-geometry = { path = "vendor/truck/truck-geometry" }
truck-geotrait = { path = "vendor/truck/truck-geotrait" }
truck-meshalgo = { path = "vendor/truck/truck-meshalgo" }
truck-modeling = { path = "vendor/truck/truck-modeling" }
truck-polymesh = { path = "vendor/truck/truck-polymesh" }
truck-stepio = { path = "vendor/truck/truck-stepio" }
truck-topology = { path = "vendor/truck/truck-topology" }


[dev-dependencies]
tempfile = "3.20"
# The SSI wave shim reachability edge (BG-CK-P2-CONTRACT, SESSION-49
# AMENDMENT): lets the look test target `use truck_certified::...` so the
# RESIDUAL gate can measure the certified Phase-2 floor from the look crate.
# Test-target-only, no production-code change (the FLOOR r2 amendment 26b1ac9
# authorized exactly this edge).
truck-certified = { path = "vendor/truck/truck-certified" }
truck-geometry = { path = "vendor/truck/truck-geometry" }
truck-evidence = { path = "vendor/truck/truck-evidence" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# PLANAR-C: Spade's splitting API can panic on dense crossing networks that it
# cannot planarize; those must be contained as per-face typed failures rather
# than aborting the whole model census. `catch_unwind` is a no-op under
# `panic = "abort"`, so unwind (the default) is required for the containment to
# work. A contained face failure is strictly safer than a process abort.
panic = "unwind"

# Quick: the development loop profile. Optimized for edit-rebuild-run wall
# time, not authoritative runtime. `target/quick/look.exe` is a
# development/debugging/focused-validation artifact and must never be used for
# recorded performance numbers — those come from `target/release/look.exe`.
#
# Semantics: `inherits = "dev"` keeps debug assertions and the unwind
# behavior PLANAR-C relies on. `opt-level = 2` keeps per-model runtime within
# ~2.5x of release so focused validation stays usable. `lto = "off"` and
# `codegen-units = 256` trade final-binary speed for high codegen parallelism;
# `incremental = true` caches per-file codegen between edits.
[profile.quick]
inherits = "dev"
opt-level = 2
debug = false
lto = "off"
incremental = true
codegen-units = 256
