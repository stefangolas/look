[package]
name = "look"
version = "0.1.0"
edition = "2024"
description = "An ultrafast, agent-oriented renderer for GLB, STL, and STEP scenes"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
pollster = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
wgpu = "30.0"

# STEP support. These track forks of truck and ruststep pinned to exact
# revisions: upstream publishes to crates.io roughly every two years, and the
# released versions cannot read AP242 at all. The forks carry the fixes and
# give us somewhere to land our own. Bump the revs deliberately, never track a
# branch, so a build is always reproducible.
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-meshalgo = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-polymesh = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-stepio = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-topology = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }

[patch.crates-io]
ruststep = { git = "https://github.com/stefangolas/ruststep", rev = "67f1f7c" }
truck-base = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-derivers = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-geometry = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-geotrait = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-meshalgo = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-modeling = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-polymesh = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-stepio = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }
truck-topology = { git = "https://github.com/stefangolas/truck", rev = "bcf676ee" }


[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
