[package]
name = "look"
version = "0.1.0"
edition = "2024"
description = "An ultrafast, agent-oriented renderer for GLB and STL scenes"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
wgpu = "30.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
