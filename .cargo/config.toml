# truck is vendored in-tree (vendor/truck/), so no path override block exists:
# there is nothing to toggle, and the fabricated-measurement failure mode that
# the old block enabled cannot recur. Edit vendor/truck/* in this repo and the
# build picks it up directly; the pinned source is recorded in Cargo.lock.

# inari (the BG-ENC interval engine) requires AVX+FMA on x86_64: its
# directed-rounding SIMD backend `compile_error!`s without them. There is no
# per-crate mechanism (build-script `cargo:rustc-flags` only allows -l/-L), so
# the flag is global per-target. rustc does NOT contract `a*b+c` into FMA
# without fast-math, so float results remain bit-identical; the only effect is
# x86_64 codegen/performance variance. BENCHMARK CLAIMS MUST BE RE-VALIDATED
# after this lands (see GENERATION_KERNEL_BUILD_SPEC.md P-5). The aarch64
# backend needs no flag.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-feature=+avx,+fma"]

# FAST INNER LOOP aliases. These drive the `quick` profile (target/quick/),
# the development artifact. Release builds stay `cargo build --release --locked`
# and remain the authoritative artifact (target/release/look.exe).
#
#   cargo qcheck   -> check --profile quick --locked
#   cargo qbuild   -> build --profile quick --locked
#   cargo qtest    -> test --profile quick --tests --locked
#
# Narrow kernel test: cargo test --profile quick --lib <filter> --locked
[alias]
qcheck = "check --profile quick --locked"
qbuild = "build --profile quick --locked"
qtest = "test --profile quick --tests --locked"
