# Local truck iteration, disabled.
#
# `look` builds against `stefangolas/truck` pinned by exact revision in
# Cargo.toml, so a build is reproducible from a clean clone. To iterate on the
# fork instead, uncomment the block below and point it at a local checkout;
# re-comment it and bump the rev before committing, because a path override is
# invisible in `Cargo.lock` and a measurement taken through one is not a
# measurement of anything that has been pushed.
#
# The comment above said "disabled" while the block was live, and it stayed
# that way for 37 unpushed truck commits — every census taken over them
# measured a tree no clean clone could build. If you uncomment this, re-comment
# it before reporting a number.
#
# Re-commented 2026-08-07 after PROJ-003 Stage A landing; rev bumped to bcf676ee.
#
# The override also bites in the direction the note above does not mention: it
# decouples the build from Cargo.toml's pin in *both* directions. During WAVE-5
# the fork HEAD advanced while the pin stood still, and a diagnostics-only edit
# appeared to recover 39 faces on 00009190 that were really a different truck
# commit. If a change that cannot move geometry moves it, check
# `git -C ../truck-fork log -1` before believing the diff.
#
# paths = [
#     "../truck-fork/truck-base",
#     "../truck-fork/truck-derivers",
#     "../truck-fork/truck-geometry",
#     "../truck-fork/truck-geotrait",
#     "../truck-fork/truck-meshalgo",
#     "../truck-fork/truck-modeling",
#     "../truck-fork/truck-polymesh",
#     "../truck-fork/truck-stepio",
#     "../truck-fork/truck-topology",
# ]
