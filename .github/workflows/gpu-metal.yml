name: gpu-metal-correctness-virtual

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  render-smoke:
    # Standard personal-account runner. It exposes an Apple M1/Metal device,
    # but it is virtualized: correctness only, never publish its timings as
    # bare-metal performance results.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Record Metal adapter
        run: cargo run --release -- doctor --json | tee doctor.json
      - name: Render GPU smoke fixture
        run: cargo test --release --test gpu_smoke -- --ignored --nocapture --test-threads=1
      - name: Upload fingerprint and render
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metal-correctness-${{ github.run_id }}
          path: |
            doctor.json
            target/gpu-smoke/triangle.glb
            target/gpu-smoke/triangle.png
          if-no-files-found: warn
          retention-days: 30
